spring.application.name=guardianvoice-backend
server.port=8080

# ---- Database -------------------------------------------------------------
# Default: in-memory H2, so the project runs immediately with no setup.
# Data resets every restart -- fine for development, not for production.
spring.datasource.url=jdbc:h2:mem:guardianvoice;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- MySQL (production) ----------------------------------------------------
# Comment out the H2 block above and uncomment this to run against MySQL.
# Create the schema first with database/schema.sql, or leave ddl-auto=update
# and let Hibernate create/adjust the tables for you.
#
# spring.datasource.url=jdbc:mysql://localhost:3306/guardianvoice?useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=your_db_user
# spring.datasource.password=your_db_password
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- JWT --------------------------------------------------------------------
# Override guardianvoice.jwt.secret via an environment variable in real
# deployments -- never commit a real secret to git.
guardianvoice.jwt.secret=${JWT_SECRET:change-this-dev-secret-before-deploying-guardianvoice}
guardianvoice.jwt.expiration-ms=86400000
